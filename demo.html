<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Levoit ESPHome Card — Single & Whole-Home Preview</title>
  <style>
    body {
      margin: 0;
      padding: 28px;
      background: #191a21;
      color: #f8f8f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .layout {
      display: grid;
      grid-template-columns: 360px 480px;
      gap: 24px;
      justify-content: center;
      align-items: start;
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="col">
      <levoit-esphome-card id="card1"></levoit-esphome-card>
      <levoit-esphome-card id="card2"></levoit-esphome-card>
    </div>
    <div class="col">
      <levoit-esphome-card id="overview"></levoit-esphome-card>
    </div>
  </div>

  <script type="module" src="./levoit-esphome-card.js"></script>
  <script type="module">
    const rooms = [
      { id: "bedroom",  name: "Bedroom Core 300S",     on: true,  pct: 67,  step: 33.3333, pm25: 5,  aqi: 1, cadr: 142, filter: 92, display: true,  lock: false, mode: "Auto",   autoMode: "Quiet",   timer: 60 },
      { id: "living",   name: "Living Room Core 400S", on: true,  pct: 100, step: 25,      pm25: 68, aqi: 4, cadr: 442, filter: 18, display: true,  lock: true,  mode: "Manual", autoMode: "Default", timer: 0  },
      { id: "office",   name: "Office Core 300S",      on: true,  pct: 33,  step: 33.3333, pm25: 9,  aqi: 1, cadr: 85,  filter: 81, display: false, lock: false, mode: "Sleep",  autoMode: "Default", timer: 0  },
      { id: "kitchen",  name: "Kitchen Vital 200S",    on: true,  pct: 75,  step: 25,      pm25: 41, aqi: 3, cadr: 310, filter: 64, display: true,  lock: false, mode: "Auto",   autoMode: "Default", timer: 30 },
      { id: "nursery",  name: "Nursery Core 300S",     on: true,  pct: 33,  step: 33.3333, pm25: 4,  aqi: 1, cadr: 72,  filter: 96, display: false, lock: true,  mode: "Sleep",  autoMode: "Quiet",   timer: 0  },
      { id: "guest",    name: "Guest Room Core 300S",  on: false, pct: 0,   step: 33.3333, pm25: 11, aqi: 1, cadr: 0,   filter: 88, display: false, lock: false, mode: "Manual", autoMode: "Default", timer: 0  },
      { id: "studio",   name: "Studio Core 600S",      on: true,  pct: 50,  step: 25,      pm25: 22, aqi: 2, cadr: 320, filter: 7,  display: true,  lock: false, mode: "Auto",   autoMode: "Room Size", timer: 0 },
      { id: "hallway",  name: "Hallway Core 300S",     on: false, pct: 0,   step: 33.3333, pm25: 14, aqi: 2, cadr: 0,   filter: 73, display: false, lock: false, mode: "Manual", autoMode: "Default", timer: 0  },
    ];

    const states = {};
    rooms.forEach((r) => {
      states[`fan.${r.id}_fan`] = { state: r.on ? "on" : "off", attributes: { friendly_name: `${r.name} Fan`, percentage: r.pct, percentage_step: r.step } };
      states[`sensor.${r.id}_aq_pm_2_5`] = { state: String(r.pm25) };
      states[`sensor.${r.id}_aqi`] = { state: String(r.aqi) };
      states[`sensor.${r.id}_current_cadr`] = { state: String(r.cadr) };
      states[`sensor.${r.id}_filter`] = { state: String(r.filter) };
      states[`binary_sensor.${r.id}_filter_low`] = { state: r.filter < 10 ? "on" : "off" };
      states[`switch.${r.id}_display`] = { state: r.display ? "on" : "off" };
      states[`switch.${r.id}_child_lock`] = { state: r.lock ? "on" : "off" };
      states[`select.${r.id}_fan_operating_mode`] = { state: r.mode, attributes: { options: ["Manual", "Sleep", "Auto"] } };
      states[`select.${r.id}_auto_mode`] = { state: r.autoMode, attributes: { options: ["Default", "Quiet", "Room Size"] } };
      states[`number.${r.id}_timer_min`] = { state: String(r.timer) };
      states[`text_sensor.${r.id}_timer_remaining`] = { state: r.timer ? `${r.timer} min` : "Off" };
      states[`text_sensor.${r.id}_error`] = { state: "Ok" };
    });

    const cards = [document.getElementById("card1"), document.getElementById("card2"), document.getElementById("overview")];
    const hass = {
      states,
      callService(domain, service, data) {
        const st = states[data.entity_id];
        if (!st) return;
        const prefix = data.entity_id.split(".")[1].split("_")[0];
        if (domain === "fan") {
          if (service === "turn_on") { st.state = "on"; if (!st.attributes.percentage) st.attributes.percentage = 33; }
          if (service === "turn_off") { st.state = "off"; }
          if (service === "set_percentage") { st.state = "on"; st.attributes.percentage = data.percentage; states[`select.${prefix}_fan_operating_mode`].state = "Manual"; }
        } else if (domain === "select" && service === "select_option") {
          st.state = data.option;
          if (data.entity_id.includes("operating_mode")) states[`fan.${prefix}_fan`].state = "on";
        } else if (domain === "switch" && service === "toggle") {
          st.state = st.state === "on" ? "off" : "on";
        } else if (domain === "number" && service === "set_value") {
          st.state = String(data.value);
          states[`text_sensor.${prefix}_timer_remaining`].state = data.value ? `${data.value} min` : "Off";
        }
        cards.forEach((c) => { c.hass = { ...hass }; });
      },
    };

    cards[0].setConfig({ entity: "fan.bedroom_fan", theme: "dracula" });
    cards[1].setConfig({ entity: "fan.living_fan", theme: "dracula", compact: true });
    cards[2].setConfig({
      name: "Whole-Home Air Purifiers",
      theme: "dracula",
      entities: rooms.map((r) => `fan.${r.id}_fan`),
    });
    cards.forEach((c) => { c.hass = hass; });
  </script>
</body>
</html>
